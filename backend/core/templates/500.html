<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong · Bloom &amp; Petals</title>
<link rel="icon" type="image/svg+xml" href="/static/admin/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fdfbf7; --ink:#1f1a1c; --muted:#6e6368; --rose:#b53352; --rose-dark:#962744; --line:#f1e8d9; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--cream); color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:10px; padding:18px 32px; border-bottom:1px solid var(--line); font-family:"Cormorant Garamond",Georgia,serif; font-size:26px; }
  header svg { width:32px; height:32px; }
  header em { color:var(--rose); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
  .wrap { max-width:520px; text-align:center; animation:fadeUp .5s ease-out both; }
  .bloom { position:relative; width:160px; height:160px; margin:0 auto 32px; border-radius:50%; background:linear-gradient(135deg,#fbe8ea,#f9f4ec 50%,#e2ebe2); }
  .bloom svg { position:absolute; left:50%; top:50%; transform:translate(-50%,-42%) rotate(28deg); filter:drop-shadow(0 4px 8px rgba(31,26,28,.12)); }
  .petal { position:absolute; border-radius:999px; background:#eeaab4; opacity:.7; }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--rose); margin:0 0 12px; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:500; font-size:48px; line-height:1.05; margin:0 0 16px; letter-spacing:-.01em; }
  p { color:var(--muted); line-height:1.6; margin:0; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:32px; }
  .btn { display:inline-flex; align-items:center; border-radius:999px; padding:11px 22px; font-size:14px; font-weight:500; text-decoration:none; transition:.2s; }
  .btn-primary { background:var(--rose); color:#fff; } .btn-primary:hover { background:var(--rose-dark); }
  .btn-secondary { background:#fff; color:var(--ink); border:1px solid var(--line); } .btn-secondary:hover { border-color:#eeaab4; color:var(--rose); }
  footer { padding:20px 32px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); text-align:center; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (max-width:600px) { h1 { font-size:36px; } header { padding:14px 20px; font-size:22px; } }
</style>
</head>
<body>
<header><svg viewBox="0 0 64 64" width="32" height="32" aria-hidden><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2778a"/><stop offset="1" stop-color="#b53352"/></linearGradient></defs><path d="M32 58 C32 46 26 40 18 38" fill="none" stroke="#3f6145" stroke-width="2.4" stroke-linecap="round"/><path d="M18 38 C11 36 9 30 12 27 C18 27 22 31 18 38 Z" fill="#527a58"/><g transform="translate(32 28)"><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(72)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(144)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(216)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(288)"/><circle r="5.5" fill="#d9b36a"/><circle r="2" cx="-1.5" cy="-1.5" fill="#fdfbf7" opacity=".8"/></g></svg> <span>Bloom <em>&amp;</em> Petals</span></header>
<main>
  <div class="wrap">
    <div class="bloom">
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2778a"/><stop offset="1" stop-color="#b53352"/></linearGradient></defs><path d="M32 58 C32 46 26 40 18 38" fill="none" stroke="#3f6145" stroke-width="2.4" stroke-linecap="round"/><path d="M18 38 C11 36 9 30 12 27 C18 27 22 31 18 38 Z" fill="#527a58"/><g transform="translate(32 28)"><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(72)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(144)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(216)"/><ellipse rx="7.5" ry="13" cy="-12" fill="url(#p)" transform="rotate(288)"/><circle r="5.5" fill="#d9b36a"/><circle r="2" cx="-1.5" cy="-1.5" fill="#fdfbf7" opacity=".8"/></g></svg>
      <span class="petal" style="left:24px;bottom:20px;width:16px;height:28px;transform:rotate(60deg)"></span>
      <span class="petal" style="right:28px;bottom:12px;width:14px;height:24px;transform:rotate(-25deg);background:#e2778a;opacity:.6"></span>
      <span class="petal" style="right:56px;bottom:4px;width:12px;height:20px;transform:rotate(15deg);background:#f6d0d5;opacity:1"></span>
    </div>
    <p class="eyebrow">500 · Something went wrong</p>
    <h1>We dropped the vase</h1>
    <p>An unexpected error happened on our side. The team has been notified. Please try again in a moment.</p>
    <div class="actions">
      <a class="btn btn-primary" href="javascript:location.reload()">Try again</a><a class="btn btn-secondary" href="/">Back to the shop</a>
    </div>
  </div>
</main>
<footer>Bloom &amp; Petals · 12 Petal Lane, Springfield</footer>
</body>
</html>
